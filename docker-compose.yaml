services:
  mysql:
    image: mysql:8.4
    container_name: bfstore-mysql
    environment:
      MYSQL_ROOT_PASSWORD: bfstore_root_password
    ports:
      - "3306:3306"
    volumes:
      - bfstore_mysql_data:/var/lib/mysql
      - ./deploy/local/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - bfstore
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-pbfstore_root_password"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  catalog-service:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    container_name: bfstore-catalog-service
    depends_on:
      mysql:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      SERVICE_VERSION: ${CATALOG_SERVICE_VERSION:-local}

      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${CATALOG_DB_NAME:-bfstore_catalog}
      MYSQL_USER: ${CATALOG_DB_USER:-bfstore_catalog}
      MYSQL_PASSWORD: ${CATALOG_DB_PASSWORD:-bfstore_catalog_password}

      CATALOG_SERVICE_GRPC_PORT: ${CATALOG_SERVICE_GRPC_PORT:-50051}
      GRPC_REFLECTION_ENABLED: "true"

      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
      TRACES_ENABLED: ${TRACES_ENABLED:-true}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_EXPORT_INTERVAL: ${METRICS_EXPORT_INTERVAL:-10s}
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    ports:
      - "${CATALOG_SERVICE_GRPC_PORT:-50051}:50051"
    networks:
      - bfstore

  basket-service:
    build:
      context: .
      dockerfile: services/basket-service/Dockerfile
    container_name: bfstore-basket-service
    depends_on:
      mysql:
        condition: service_healthy
      catalog-service:
        condition: service_started
      otel-collector:
        condition: service_started
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      SERVICE_VERSION: ${BASKET_SERVICE_VERSION:-local}

      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${BASKET_DB_NAME:-bfstore_basket}
      MYSQL_USER: ${BASKET_DB_USER:-bfstore_basket}
      MYSQL_PASSWORD: ${BASKET_DB_PASSWORD:-bfstore_basket_password}

      BASKET_SERVICE_GRPC_PORT: ${BASKET_SERVICE_GRPC_PORT:-50052}
      GRPC_REFLECTION_ENABLED: "true"

      # Basket Service calls Catalog Service over the internal Compose network.
      CATALOG_GRPC_ADDR: catalog-service:50051
      CATALOG_REQUEST_TIMEOUT: ${CATALOG_REQUEST_TIMEOUT:-2s}

      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
      TRACES_ENABLED: ${TRACES_ENABLED:-true}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_EXPORT_INTERVAL: ${METRICS_EXPORT_INTERVAL:-10s}
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    ports:
      - "${BASKET_SERVICE_GRPC_PORT:-50052}:50052"
    networks:
      - bfstore

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: bfstore-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/local/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"
    networks:
      - bfstore
    restart: unless-stopped
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: bfstore-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    networks:
      - bfstore

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: bfstore-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
    volumes:
      - ./deploy/local/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - bfstore_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - bfstore
    depends_on:
      otel-collector:
        condition: service_started

  grafana:
    image: grafana/grafana:11.4.0
    container_name: bfstore-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - bfstore_grafana_data:/var/lib/grafana
      - ./deploy/local/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/local/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - bfstore

networks:
  bfstore:
    name: bfstore
    driver: bridge

volumes:
  # These names intentionally remain Compose-managed so the existing Makefile
  # volume reset target still matches docker compose -p bfstore behaviour.
  bfstore_mysql_data:
  bfstore_prometheus_data:
  bfstore_grafana_data:
